<nav id="dock" class="dock">
    <button class="dock-item" data-panel="location-search"
        aria-label="Location Search">
        <span class="icon">🔍</span>
    </button>
    <button class="dock-item" data-panel="trails" aria-label="Trails">
        <span class="icon">🧭</span>
    </button>
    <button class="dock-item" data-panel="observations"
        aria-label="Observations">
        <span class="icon">🍃</span>
    </button>
    <button class="dock-item" data-panel="trail-planning"
        aria-label="Trail Planning">
        <span class="icon">🗺️</span>
    </button>
</nav>

<div id="panels" class="panels">
    <div id="location-search" class="panel">
        <h3>Location Search</h3>
        <div class="panel-content">
            <input type="text" id="locationSearch"
                placeholder="Enter a location..." aria-label="Search location">
            <button id="searchLocationBtn">Search</button>
            <button id="useMyLocationBtn">Use My Location</button>
        </div>
    </div>
    <div id="trails" class="panel">
        <h3>Trails</h3>
        <div class="panel-content">
            <button id="findNearbyTrailsBtn">Find Nearby Trails</button>
        </div>
    </div>
    <div id="observations" class="panel">
        <h3>Observations</h3>
        <div class="panel-content">
            <input type="text" id="speciesSearch"
                placeholder="Enter a species..." aria-label="Search species">
            <button id="searchObservationsBtn">Search Observations</button>
        </div>
    </div>
    <div id="trail-planning" class="panel">
        <h3>Trail Planning</h3>
        <div class="panel-content">
            <p>Trail planning features coming soon!</p>
        </div>
    </div>
</div>
